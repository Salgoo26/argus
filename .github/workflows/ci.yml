# PR 검사 (architecture 8-1 ①)
# - lint(ruff) + 테스트(pytest, Postgres 16 서비스 컨테이너) — 앱별 matrix
# - 프론트엔드 lint(eslint)·타입 검사(tsc)·빌드 — M5부터
# - 시크릿 스캔(gitleaks) — 전체 커밋 이력 대상
# - 설정 파일 스캔(Trivy config, report-only) + 도커 빌드 가능 여부(push 안 함) — M1부터 (architecture 8-5)
# - Walking Skeleton 시나리오 E2E(전체 스택 + 해시체인 검증) — M6부터
# CodeQL은 GitHub 기본 설정(default setup)으로 별도 실행된다.
# Trivy 이미지 스캔은 main 빌드 단계(②)에서 "Skeleton 로컬 동작 후" 추가.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 최소 권한 — 코드 읽기만
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [argus-api, platform-api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI 러너 안에서만 쓰고 버리는 임시 DB 계정
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Test (pytest)
        run: pytest

  # 프론트엔드 — lint(eslint)·타입 검사(tsc)·빌드 (architecture 8-5 "프론트 추가 PR(M5)")
  web:
    name: web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [platform-web, argus-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: 1 # 빌드 정보가 외부로 나가지 않게
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Walking Skeleton 시나리오 E2E (M6) — 전체 스택을 띄워 플랫폼 다운로드 → 수집 → 탐지 → 소명 → 승인,
  # 마지막에 해시체인 검증. 로컬과 같은 스크립트(scripts/e2e.sh)를 그대로 실행한다
  e2e:
    name: e2e scenario
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # e2e/는 앱 matrix 밖이라 여기서 린트 — 버전은 apps/argus-api/pyproject.toml의 ruff와 맞춘다
      - name: Lint e2e (ruff)
        run: |
          pipx run ruff==0.16.9 check --output-format=github e2e
          pipx run ruff==0.16.9 format --check e2e

      # 실행마다 만들고 버리는 시크릿 — .env.example의 change-me 칸만 무작위 값으로 채운다
      # (값은 로그에 찍지 않는다. 레포·CI 설정에 저장된 시크릿을 쓰지 않음)
      - name: Create throwaway .env
        run: |
          while IFS= read -r line; do
            if [[ "$line" =~ ^([A-Z0-9_]+)=change-me ]]; then
              echo "${BASH_REMATCH[1]}=$(openssl rand -hex 32)"
            else
              echo "$line"
            fi
          done < .env.example > .env

      - name: Run scenario
        run: bash scripts/e2e.sh

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 현재 파일뿐 아니라 전체 커밋 이력을 검사
          persist-credentials: false

      # 서드파티 Action 대신 공식 이미지를 버전 고정으로 직접 실행 (토큰 권한 부여 불필요)
      - name: Scan git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --verbose

  # Dockerfile 등 설정 파일 오설정 검사. report-only로 시작 — 결과를 보고 보안성 검토 단계에서 조치,
  # 이후 Critical/High에서 차단으로 전환 (architecture 8-2).
  # docker-compose 파일은 Trivy config가 인식하지 않는다(0.74.0 확인) — Dockerfile만 대상.
  trivy-config:
    name: config scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # gitleaks와 같은 방식: 서드파티 Action 대신 공식 이미지를 버전 고정으로 직접 실행
      - name: Scan config files
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.74.0 \
            config --exit-code 0 --severity LOW,MEDIUM,HIGH,CRITICAL /repo

  # 이미지가 실제로 빌드되는지만 확인 (push 안 함 — GHCR 게시는 main 빌드 단계)
  docker-build:
    name: docker build (${{ matrix.app }}:${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: argus-api, target: runtime }
          - { app: argus-api, target: dev }
          - { app: platform-api, target: runtime }
          - { app: platform-api, target: dev }
          - { app: platform-web, target: runtime }
          - { app: argus-web, target: runtime }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build --target ${{ matrix.target }} -t ${{ matrix.app }}:ci apps/${{ matrix.app }}
