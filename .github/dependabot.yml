# 의존성 취약점 알림 + 업데이트 PR 자동 생성 (architecture 8-1 [상시])
# 앱이 추가되면 해당 생태계를 여기에 추가한다:
#   - npm: apps/platform-web, apps/argus-web (M5)
#   - docker: 앱 Dockerfile (argus-api M1, platform-api M2, platform-web·argus-web M5, db-gateway 기능 레이어 8)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: pip
    directories:
      - /apps/argus-api
      - /apps/platform-api
      - /apps/db-gateway
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # 프론트엔드 (Next.js) — 버전은 package.json에 정확히 고정, 갱신은 이 PR로만
  - package-ecosystem: npm
    directories:
      - /apps/platform-web
      - /apps/argus-web
    schedule:
      interval: weekly
    # 메이저 업(TypeScript 7·ESLint 10·@types/node 26·Next 17 등)은 호환 확인이 필요한 별도 작업 —
    # create-next-app이 고른 검증 조합을 유지하고 같은 메이저 안의 갱신만 받는다 (2026-10-01 #17 사유)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # Dockerfile 베이스 이미지 (python:3.12-slim, node:24-alpine) 갱신
  - package-ecosystem: docker
    directories:
      - /apps/argus-api
      - /apps/platform-api
      - /apps/db-gateway
      - /apps/platform-web
      - /apps/argus-web
    schedule:
      interval: weekly
    # Python은 3.12 고정(CLAUDE.md 5절, requires-python >=3.12,<3.13) — 3.12.x 패치만 받는다.
    # 3.13·3.14 같은 버전 업은 의존성 호환 확인이 필요한 별도 작업 (2026-09-29 PR #6 종료 사유)
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node는 24 LTS 고정 — 24.x 갱신만 받는다. 메이저 업은 Next.js 호환 확인이 필요한 별도 작업
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
