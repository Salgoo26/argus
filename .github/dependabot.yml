# 의존성 취약점 알림 + 업데이트 PR 자동 생성 (architecture 8-1 [상시])
# 앱이 추가되면 해당 생태계를 여기에 추가한다:
#   - npm: apps/platform-web, apps/argus-web (M5)
#   - docker: 나머지 앱 Dockerfile (M2~)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: pip
    directories:
      - /apps/argus-api
      - /apps/platform-api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # Dockerfile 베이스 이미지 (python:3.12-slim) 갱신
  - package-ecosystem: docker
    directories:
      - /apps/argus-api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
