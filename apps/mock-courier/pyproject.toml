[project]
name = "mock-courier"
version = "0.0.0"
description = "가상 택배 서비스 — 접수·조회·접수취소·반품 회수 API, 시간 기반 상태 진행·쇼핑몰 통지, 자체 DB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.5",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.5",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "httpx2==2.13.1",  # FastAPI TestClient
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
